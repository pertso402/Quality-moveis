<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quality Móveis Premium — Catálogo</title>
<meta name="description" content="Conjuntos, chaises e balanços em corda náutica e fibra sintética.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=DM+Mono:wght@400;500&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#24140a; --paper:#efe5d3; --paper2:#e4d7bf; --clay:#c4501b; --cream:#f3e8d4;
  --head:'Bricolage Grotesque',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  --house:polygon(50% 0,100% 15%,100% 100%,0 100%,0 15%);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--head);font-weight:400;line-height:1.35;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--clay);color:var(--cream)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* logo (só a assinatura usa a serifa da marca) */
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:1;color:inherit;text-decoration:none}
.logo svg{width:26px;margin-bottom:-3px}
.logo b{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px}

/* nav */
nav{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(14px,3vw,36px);color:#fff;mix-blend-mode:difference;pointer-events:none}
nav>*{pointer-events:auto}
.filters{display:flex;gap:6px}
.filters button{padding:8px 14px;border:1px solid currentColor;border-radius:99px;opacity:.55;transition:.2s}
.filters button:hover{opacity:1}
.filters button.on{opacity:1;background:#fff;color:#000}
@media(max-width:640px){.filters button{padding:7px 10px;font-size:10px}.logo b{font-size:24px}}

/* ===== HERO ===== */
.hero{position:relative;min-height:100svh;background:var(--ink);color:var(--cream);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.hero .kick{position:absolute;top:84px;left:clamp(14px,3vw,36px);right:clamp(14px,3vw,36px);display:flex;justify-content:space-between;gap:20px;color:var(--paper2)}
.hero h1{position:relative;z-index:1;font-weight:800;font-size:clamp(70px,24vw,420px);line-height:.72;letter-spacing:-.06em;text-transform:uppercase;white-space:nowrap;margin:0 0 -.02em -.03em;transform:translateX(var(--hx,0))}
.hero .strip{position:absolute;left:0;right:0;top:15%;display:flex;gap:clamp(10px,2vw,28px);padding:0 clamp(14px,3vw,36px);z-index:2;align-items:flex-end}
.hero .strip figure{flex:1;clip-path:var(--house);background:#000;aspect-ratio:3/4;transform:translateY(var(--y,0));will-change:transform}
.hero .strip figure:nth-child(2){margin-bottom:8vh}
.hero .strip figure:nth-child(4){margin-bottom:14vh}
.hero .strip img{width:100%;height:100%;object-fit:cover}
.sticker{position:absolute;z-index:3;right:clamp(14px,5vw,80px);top:11%;background:var(--clay);color:var(--cream);width:clamp(120px,15vw,210px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;font-weight:700;font-size:clamp(16px,1.9vw,26px);line-height:1;letter-spacing:-.02em;transform:rotate(-12deg);padding:18px;box-shadow:0 0 0 6px var(--ink)}
.scrolldown{position:absolute;z-index:3;right:clamp(14px,3vw,36px);bottom:clamp(14px,3vw,36px);color:var(--ink);mix-blend-mode:normal;background:var(--cream);padding:9px 14px;border-radius:99px}
@media(max-width:700px){.hero .strip{top:19%}.hero .strip figure{aspect-ratio:3/6}.hero .strip figure:nth-child(n+4){display:none}.hero .strip figure:nth-child(2){margin-bottom:9vh}.scrolldown{bottom:auto;top:auto;right:14px;bottom:30vw}.sticker{top:12%;width:110px;font-size:14px}}

/* ticker */
.ticker{background:var(--clay);color:var(--cream);overflow:hidden;white-space:nowrap;padding:14px 0;font-weight:700;font-size:clamp(20px,2.4vw,34px);letter-spacing:-.02em;text-transform:uppercase}
.ticker div{display:inline-block;animation:tk 28s linear infinite}
.ticker span{margin:0 22px}.ticker span:nth-child(even){font-family:var(--mono);font-weight:400;font-size:.55em;vertical-align:middle;letter-spacing:.1em}
@keyframes tk{to{transform:translateX(-50%)}}

/* ===== SCENES ===== */
.scene{position:relative;min-height:100svh;padding:clamp(84px,8vw,110px) clamp(14px,3vw,36px) 120px;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:auto 1fr;gap:0 clamp(10px,1.6vw,24px);align-items:start;overflow:hidden;isolation:isolate;transition:background .8s}
.scene:nth-of-type(even){background:var(--paper2)}
.blob{position:absolute;z-index:-1;width:min(64vw,900px);aspect-ratio:1;border-radius:50%;background:var(--tint,var(--clay));top:50%;left:24%;transform:translate(-50%,-50%);opacity:.9;transition:background .7s,transform 1s cubic-bezier(.2,.8,.2,1)}
.scene.flip .blob{left:76%}
.bgname{grid-column:1/-1;grid-row:1;position:relative;z-index:1;pointer-events:none;font-weight:800;text-transform:uppercase;letter-spacing:-.06em;line-height:.8;font-size:clamp(56px,11.5vw,210px);white-space:nowrap;margin-bottom:clamp(24px,3vw,44px);display:flex;gap:.18em;transform:translateX(var(--sx,0))}
.bgname span:nth-child(2){-webkit-text-stroke:2px var(--ink);color:transparent}
.pic{grid-column:1/7;grid-row:2;position:relative;z-index:1}
.scene.flip .pic{grid-column:7/13}
.scene.flip .copy{grid-column:1/7}
.copy{grid-column:8/13;grid-row:2;position:relative;z-index:2;display:flex;flex-direction:column;gap:20px;align-self:center}
.house{position:relative;clip-path:var(--house);aspect-ratio:4/4.6;background:#0e0804;cursor:none}
.house img,.house video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.house img.enter{animation:wipe .7s cubic-bezier(.7,0,.2,1) both}
@keyframes wipe{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0)}}
.num{position:absolute;z-index:3;left:-4px;top:-14px;font-weight:800;font-size:clamp(60px,9vw,130px);line-height:1;letter-spacing:-.06em;color:var(--cream);mix-blend-mode:difference;pointer-events:none}
.thumbs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.thumbs button{width:60px;height:60px;border-radius:12px;overflow:hidden;opacity:.55;outline:2px solid transparent;outline-offset:2px;transition:.2s;position:relative}
.thumbs button.on{opacity:1;outline-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .pl{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.5);color:#fff;font-size:18px}
.cat{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.cat::before{content:"";width:34px;height:2px;background:var(--ink)}
.copy h2{font-weight:600;font-size:clamp(18px,1.7vw,26px);line-height:1.1;letter-spacing:-.02em;max-width:420px}
.copy .d{font-size:16px;max-width:430px;opacity:.85}
.price{display:flex;align-items:flex-start;line-height:.8;font-weight:800;letter-spacing:-.07em;margin:2px 0 0;color:var(--ink)}
.pay{margin-top:-10px}
.price sup{font-size:clamp(18px,2vw,28px);letter-spacing:0;margin:.3em .35em 0 0;font-weight:700}
.price b{font-size:clamp(64px,7.5vw,128px);font-weight:800}
.price i{font-style:normal;font-size:clamp(18px,2vw,28px);letter-spacing:0;margin-top:.3em;font-weight:700}
.pay{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw .lbl{width:100%;display:flex;justify-content:space-between}
.sw .lbl b{font-weight:500}
.dot{width:42px;height:42px;border-radius:50%;border:3px solid var(--paper);outline:2px solid transparent;transition:.25s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.dot:hover{transform:translateY(-4px)}
.dot.on{outline-color:var(--ink);transform:scale(1.14)}
.tag{background:var(--cream);border:2px dashed var(--ink);border-radius:6px;padding:14px 16px;position:relative;transform:rotate(-1deg)}
.tag::before{content:"";position:absolute;left:50%;top:-9px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.tag dl{display:grid;grid-template-columns:1fr auto;gap:8px 14px;font-family:var(--mono);font-size:12px;align-items:baseline}
.tag dt,.tag dd{line-height:1.3;min-width:0}
.tag dt{text-transform:uppercase;opacity:.7}.tag dd{font-weight:500;text-align:right}
.tag p{font-family:var(--mono);font-size:10px;margin-top:8px;opacity:.6}
.feats{list-style:none;display:flex;gap:6px;flex-wrap:wrap}
.feats li{font-size:13px;border:1.5px solid var(--ink);border-radius:99px;padding:5px 12px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn{padding:16px 24px;border-radius:99px;font-weight:700;font-size:15px;letter-spacing:-.01em;transition:.25s;text-decoration:none;display:inline-flex;align-items:center;gap:10px}
.btn.a{background:var(--ink);color:var(--cream)}.btn.a:hover{background:var(--clay);transform:rotate(-2deg) scale(1.04)}
.btn.b{border:2px solid var(--ink)}.btn.b:hover{background:var(--ink);color:var(--cream)}
.btn.c{font-family:var(--mono);font-size:11px;text-transform:uppercase;padding:10px 0;border-radius:0;border-bottom:2px solid currentColor;font-weight:500}
.hide{display:none!important}
@media(max-width:900px){
  .scene{display:flex;flex-direction:column;align-items:stretch;gap:26px;padding-top:80px}
  .pic{order:1}.copy{order:2}.blob{width:120vw;top:24%;left:50%!important}
  .bgname{font-size:16vw;order:0;transform:none!important;margin-bottom:0;flex-wrap:wrap;white-space:normal;gap:0 .2em;line-height:.85}
  .num{font-size:70px}
}

/* ===== PRICE LIST ===== */
.plist{background:var(--ink);color:var(--cream);padding:clamp(70px,9vw,140px) clamp(14px,3vw,36px);position:relative}
.plist h3{font-weight:800;font-size:clamp(46px,9vw,150px);line-height:.85;letter-spacing:-.06em;text-transform:uppercase;margin-bottom:40px}
.plist h3 em{font-style:normal;color:var(--clay)}
.row{display:grid;grid-template-columns:60px 1fr auto 40px;gap:14px;align-items:baseline;padding:18px 0;border-top:1px solid rgba(243,232,212,.25);cursor:pointer;transition:.25s;text-decoration:none;color:inherit}
.row:last-of-type{border-bottom:1px solid rgba(243,232,212,.25)}
.row:hover{padding-left:16px;background:var(--clay)}
.row .n{font-family:var(--mono);font-size:13px}
.row .t{font-weight:700;font-size:clamp(22px,3.6vw,54px);letter-spacing:-.04em;line-height:1;text-transform:uppercase}
.row .t small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;font-weight:400;margin-top:6px;opacity:.7}
.row .p{font-weight:800;font-size:clamp(24px,3.6vw,54px);letter-spacing:-.05em}
.row .go{font-size:26px}
.float{position:fixed;z-index:70;width:230px;aspect-ratio:3/3.5;clip-path:var(--house);pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.6);transition:opacity .2s,transform .25s;background:#000}
.float.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.float img{width:100%;height:100%;object-fit:cover}
@media(hover:none){.float{display:none}}

/* footer */
footer{background:var(--clay);color:var(--cream);padding:clamp(60px,8vw,120px) clamp(14px,3vw,36px) 30px;overflow:hidden}
footer h4{font-weight:800;font-size:clamp(48px,11vw,190px);line-height:.82;letter-spacing:-.06em;text-transform:uppercase}
footer h4 span{-webkit-text-stroke:2px var(--cream);color:transparent}
footer .bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;margin-top:50px}
footer .btn{background:var(--cream);color:var(--ink);font-size:18px;padding:20px 32px}
footer .btn:hover{background:var(--ink);color:var(--cream)}
footer .fine{margin-top:40px;opacity:.8}

/* cart pill + drawer */
.pill{position:fixed;z-index:80;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--cream);border-radius:99px;padding:8px 8px 8px 22px;display:flex;align-items:center;gap:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:.3s;font-weight:600}
.pill:hover{transform:translateX(-50%) scale(1.04)}
.pill b{background:var(--clay);border-radius:99px;padding:11px 18px;font-weight:800}
.pill.bump{animation:bump .5s}
@keyframes bump{40%{transform:translateX(-50%) scale(1.14) rotate(-2deg)}}
.scrim{position:fixed;inset:0;z-index:90;background:rgba(36,20,10,.55);opacity:0;pointer-events:none;transition:.3s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:100;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--paper);transform:translateX(105%);transition:.5s cubic-bezier(.7,0,.2,1);display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer header{display:flex;justify-content:space-between;align-items:flex-start;padding:22px 24px}
.drawer h3{font-weight:800;font-size:56px;line-height:.85;letter-spacing:-.06em;text-transform:uppercase}
.drawer header button{font-size:22px;width:44px;height:44px;border-radius:50%;border:2px solid var(--ink)}
.items{flex:1;overflow-y:auto;padding:0 24px}
.it{display:grid;grid-template-columns:80px 1fr auto;gap:14px;padding:14px 0;border-top:2px solid var(--ink);align-items:center}
.it img{width:80px;height:92px;object-fit:cover;clip-path:var(--house)}
.it h5{font-weight:700;font-size:17px;line-height:1.05;letter-spacing:-.02em}
.it small{display:block;font-family:var(--mono);font-size:11px;margin:4px 0 8px;opacity:.7}
.qty{display:inline-flex;border:2px solid var(--ink);border-radius:99px;align-items:center}
.qty button{width:30px;height:30px;font-size:18px}.qty span{min-width:22px;text-align:center;font-family:var(--mono);font-size:13px}
.it .pr{font-weight:800;font-size:22px;letter-spacing:-.04em;text-align:right}
.it .rm{display:block;margin:6px 0 0 auto;font-family:var(--mono);font-size:10px;text-decoration:underline;text-transform:uppercase}
.empty{padding:40px 0;font-weight:700;font-size:26px;letter-spacing:-.03em;line-height:1.05}
.dfoot{padding:20px 24px 26px;background:var(--ink);color:var(--cream)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.tot b{font-weight:800;font-size:46px;letter-spacing:-.06em}
.dfoot .btn{background:var(--clay);color:var(--cream);width:100%;justify-content:center}
.dfoot .btn:hover{background:var(--cream);color:var(--ink)}

.zoom{position:fixed;inset:0;z-index:200;background:rgba(20,10,4,.94);display:grid;place-items:center;opacity:0;pointer-events:none;transition:.3s;padding:16px;cursor:zoom-out}
.zoom.open{opacity:1;pointer-events:auto}
.zoom img{max-width:100%;max-height:94vh;border-radius:8px}
.toast{position:fixed;z-index:300;left:50%;top:70px;transform:translate(-50%,-140px);background:var(--clay);color:var(--cream);padding:12px 22px;border-radius:99px;font-weight:700;transition:.4s cubic-bezier(.2,.8,.2,1)}
.toast.show{transform:translate(-50%,0)}

/* cursor */
.cur{position:fixed;z-index:250;left:0;top:0;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:var(--clay);color:var(--cream);display:grid;place-items:center;font-family:var(--mono);font-size:12px;text-transform:uppercase;pointer-events:none;transform:scale(0);transition:transform .25s}
.cur.on{transform:scale(1)}
@media(hover:none){.cur{display:none}.house{cursor:pointer}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<nav>
  <a class="logo" href="#top" aria-label="Quality Móveis Premium">

/* ===== CONFIG ===== */

const P=[

 desc:"Sofá de 3 lugares, duas poltronas e uma champanheira com tampo de madeira: mesa de centro que ainda mantém as bebidas geladas.",
 v:[{n:"Clara",c:"#e8dcc6",t:"#d9b98a",img:"c3-clara"},{n:"Bege claro e marrom",c:two("#dcc7a4","#5f3f2a"),t:"#8a6142",img:"c3-bege-marrom"},{n:"Bege claro com marrom claro",c:two("#e3d2b3","#a67c52"),t:"#c19a6b",img:"c3-bege-marrom-claro"},{n:"Azul com preto",c:two("#233a7a","#111"),t:"#233a7a",img:"c3-azul-preto"},{n:"Verde",c:"#3f5b3a",t:"#3f5b3a",img:"c3-verde"},{n:"Preta e branca",c:two("#111","#f5f2ec"),t:"#2b2b2b",img:"c3-preto-branco"}],
 specs:[["Sofá 3 lugares","170×73×65 cm"],["Poltronas (2x)","73×73×65 cm"],["Champanheira","Ø80 × 40 cm"],["Assento (altura)","45 cm"]],note:"C × P × A · medidas em centímetros",
 feats:["Alumínio + corda náutica","Tampo em madeira","Copo em aço inox","Tecido impermeável"],ropes:1,sheet:"medida-sofa3"},

/* ===== HELPERS ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const brl=n=>n.toLocaleString("pt-BR");
const img=n=>`img/${n}.jpg`;
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const wa=t=>`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t)}`;
const priceH=v=>`<div class="price"><sup>R$</sup><b>${brl(v)}</b><i>,00</i></div>`;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1800)}

/* ===== TICKER ===== */
const tkw=["Corda náutica","conforto","Fibra sintética","elegância","Alumínio","durabilidade","Tecido impermeável","seu espaço, do seu jeito"];
$("#tk").innerHTML=Array(2).fill(tkw.map(t=>`<span>${t}</span>`).join("")).join("");

/* ===== CENAS ===== */
const media=p=>{const m=p.v.map((v,k)=>({t:"img",src:img(v.img),v:k}));if(p.video)m.push({t:"video",src:`img/${p.video}.mp4`,poster:img(p.v[0].img)});return m};
$("#scenes").innerHTML=P.map((p,i)=>{
 const ms=media(p);
 return `<section class="scene${i%2?" flip":""}" id="p-${p.id}" data-cat="${p.cat}" data-id="${p.id}" style="--tint:${p.v[0].t}">
  <div class="blob"></div>
  <div class="bgname" aria-hidden="true"><span>${p.d[0]}</span><span>${p.d[1]}</span></div>
  <div class="pic">
    <span class="num">${String(i+1).padStart(2,"0")}</span>
    <div class="house" data-open><img src="${img(p.v[0].img)}" alt="${p.name}" loading="${i?"lazy":"eager"}"></div>
    ${ms.length>1?`<div class="thumbs">${ms.map((m,k)=>`<button data-m="${k}" class="${k?"":"on"}" aria-label="Foto ${k+1}"><img src="${m.t==="img"?m.src:m.poster}" alt="">${m.t==="video"?'<span class="pl">▶</span>':""}</button>`).join("")}</div>`:""}
  </div>
  <div class="copy">
    <div class="cat">${p.cat}</div>
    <h2>${p.name}</h2>
    ${priceH(p.price)}
    <div class="pay">Valor do conjunto/peça · consulte pagamento e frete</div>
    ${p.v.length>1?`<div class="sw"><div class="lbl mono"><span>${p.photos?"Fotos":"Cor"}</span><b data-vn>${p.v[0].n}</b></div>${p.v.map((v,k)=>`<button class="dot${k?"":" on"}" data-v="${k}" style="background:${v.c}" title="${v.n}" aria-label="${v.n}"></button>`).join("")}</div>`:""}
    <p class="d">${p.desc}</p>
    ${p.specs.length?`<div class="tag"><dl>${p.specs.map(s=>`<dt>${s[0]}</dt><dd>${s[1]}</dd>`).join("")}</dl><p>${p.note}</p></div>`:""}
    <ul class="feats">${p.feats.map(f=>`<li>${f}</li>`).join("")}</ul>
    ${p.ropes?`<div class="sw"><div class="lbl mono"><span>Cores de corda disponíveis</span></div>${ROPES.map(r=>`<span title="${r[0]}" style="width:26px;height:26px;border-radius:50%;background:${r[1]};box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)"></span>`).join("")}</div>`:""}
    <div class="acts">
      <a class="btn a" data-ask href="#" target="_blank" rel="noopener">Quero este →</a>
      <button class="btn b" data-add>+ No pedido</button>
      ${p.sheet?`<button class="btn c" data-sheet="${p.sheet}">Ver ficha de medidas</button>`:""}
    </div>
  </div>
 </section>`}).join("");

const state={};P.forEach(p=>state[p.id]={m:0,v:0});
function setMedia(sec,k,skipAnim){
 const p=P.find(x=>x.id===sec.dataset.id),ms=media(p),m=ms[k],st=state[p.id],house=sec.querySelector(".house");
 st.m=k;if(m.t==="img"){st.v=m.v;sec.style.setProperty("--tint",p.v[m.v].t)}
 house.querySelectorAll("video").forEach(v=>v.remove());
 let el;
 if(m.t==="img"){el=document.createElement("img");el.src=m.src;el.alt=p.name;if(!skipAnim)el.className="enter"}
 else{el=document.createElement("video");Object.assign(el,{src:m.src,poster:m.poster,autoplay:true,muted:true,loop:true,playsInline:true,controls:true})}
 house.append(el);
 setTimeout(()=>{[...house.children].slice(0,-1).forEach(c=>c.remove())},720);
 sec.querySelectorAll(".dot").forEach(d=>d.classList.toggle("on",+d.dataset.v===st.v));
 sec.querySelectorAll(".thumbs button").forEach(b=>b.classList.toggle("on",+b.dataset.m===k));
 const vn=sec.querySelector("[data-vn]");if(vn)vn.textContent=p.v[st.v].n;
 sec.querySelector("[data-ask]").href=wa(`Olá! Tenho interesse no *${p.name}* (${p.v[st.v].n}) por R$ ${brl(p.price)},00. Podem me passar mais informações?`);
}
$$(".scene").forEach(s=>setMedia(s,0,true));
$("#scenes").addEventListener("click",e=>{
 const s=e.target.closest(".scene");if(!s)return;const id=s.dataset.id,p=P.find(x=>x.id===id);
 const dot=e.target.closest(".dot");if(dot)return setMedia(s,dot.dataset.v*1);
 const th=e.target.closest("[data-m]");if(th)return setMedia(s,+th.dataset.m);
 if(e.target.closest("[data-add]"))return addCart(id,state[id].v);
 const sh=e.target.closest("[data-sheet]");if(sh)return zoom(img(sh.dataset.sheet));
 const h=e.target.closest("[data-open]");if(h){const im=h.querySelector("img");if(im)zoom(im.src)}
});

/* ===== FILTROS ===== */
const cats=["Todos",...new Set(P.map(p=>p.cat))];
$("#filters").innerHTML=cats.map((c,i)=>`<button class="${i?"":"on"}" data-c="${c}">${c}</button>`).join("");
$("#filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;
 $$("#filters button").forEach(x=>x.classList.toggle("on",x===b));
 $$(".scene,.row").forEach(el=>el.classList.toggle("hide",b.dataset.c!=="Todos"&&el.dataset.cat!==b.dataset.c));
 $("#p-"+P.find(p=>b.dataset.c==="Todos"||p.cat===b.dataset.c).id).scrollIntoView();
};

/* ===== LISTA DE PREÇOS ===== */
$("#rows").innerHTML=P.map((p,i)=>`<a class="row" href="#p-${p.id}" data-cat="${p.cat}" data-id="${p.id}"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="t">${p.d.join(" ")}<small>${p.name}</small></span><span class="p">R$ ${brl(p.price)}</span><span class="go">↗</span></a>`).join("");
const fl=$("#float");
$("#rows").addEventListener("mousemove",e=>{const r=e.target.closest(".row");if(!r)return fl.classList.remove("on");
 const p=P.find(x=>x.id===r.dataset.id);fl.querySelector("img").src=img(p.v[0].img);fl.style.left=e.clientX+140+"px";fl.style.top=e.clientY+"px";fl.classList.add("on")});
$("#rows").addEventListener("mouseleave",()=>fl.classList.remove("on"));

/* ===== PARALLAX / SCROLL ===== */
let tick=false;
function onScroll(){
 const vh=innerHeight;
 $$(".scene:not(.hide)").forEach(s=>{const r=s.getBoundingClientRect();if(r.bottom<0||r.top>vh)return;
  const t=(r.top+r.height/2-vh/2)/vh;s.style.setProperty("--sx",(t*-40)+"px");
  s.querySelector(".blob").style.transform=`translate(-50%,calc(-50% + ${t*80}px)) scale(${1-Math.abs(t)*.12})`});
 $$("#strip figure").forEach(f=>f.style.setProperty("--y",(-scrollY*f.dataset.s*3)+"px"));
 $("#h1").style.setProperty("--hx",(-scrollY*.25)+"px");
 tick=false;
}
addEventListener("scroll",()=>{if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});onScroll();

/* ===== CURSOR ===== */
const cur=$("#cur");
if(matchMedia("(pointer:fine)").matches){
 addEventListener("mousemove",e=>{cur.style.transform="";cur.style.left=e.clientX+"px";cur.style.top=e.clientY+"px";
  const on=!!e.target.closest(".house");cur.classList.toggle("on",on)});
 document.addEventListener("mouseleave",()=>cur.classList.remove("on"));
}

/* ===== ZOOM ===== */
function zoom(src){$("#zoom img").src=src;$("#zoom").classList.add("open")}
$("#zoom").onclick=()=>$("#zoom").classList.remove("open");
addEventListener("keydown",e=>{if(e.key==="Escape"){$("#zoom").classList.remove("open");closeCart()}});

/* ===== PEDIDO ===== */
let cart=store.get("qmp_cart2",[]);
function addCart(id,v){const it=cart.find(c=>c.id===id&&c.v===v);it?it.q++:cart.push({id,v,q:1});save();toast("Foi pro seu pedido ✓");const pl=$("#pill");pl.classList.remove("bump");void pl.offsetWidth;pl.classList.add("bump")}
function save(){store.set("qmp_cart2",cart);render()}
function render(){
 cart=cart.filter(c=>P.find(p=>p.id===c.id));
 const n=cart.reduce((a,c)=>a+c.q,0),tot=cart.reduce((a,c)=>a+c.q*P.find(p=>p.id===c.id).price,0);
 $("#cnt").textContent=n;$("#pillTot").textContent="R$ "+brl(tot);$("#total").textContent="R$ "+brl(tot);
 $("#items").innerHTML=cart.length?cart.map((c,i)=>{const p=P.find(x=>x.id===c.id),v=p.v[c.v]||p.v[0];return `<div class="it"><img src="${img(v.img)}" alt=""><div><h5>${p.name}</h5><small>${v.n}</small><div class="qty"><button data-q="${i}" data-d="-1" aria-label="Menos">−</button><span>${c.q}</span><button data-q="${i}" data-d="1" aria-label="Mais">+</button></div></div><div><div class="pr">R$ ${brl(p.price*c.q)}</div><button class="rm" data-rm="${i}">remover</button></div></div>`}).join(""):`<div class="empty">Nada por aqui ainda.<br>Toque em “+ No pedido” nas peças que gostou.</div>`;
 $("#sendWA").disabled=!cart.length;$("#sendWA").style.opacity=cart.length?1:.4;
}
$("#items").onclick=e=>{const q=e.target.closest("[data-q]"),r=e.target.closest("[data-rm]");
 if(q){const c=cart[+q.dataset.q];c.q+=+q.dataset.d;if(c.q<1)cart.splice(+q.dataset.q,1);save()}
 if(r){cart.splice(+r.dataset.rm,1);save()}};
const openCart=()=>{$("#drawer").classList.add("open");$("#scrim").classList.add("open")};
function closeCart(){$("#drawer").classList.remove("open");$("#scrim").classList.remove("open")}
$("#pill").onclick=openCart;$("#closeCart").onclick=$("#scrim").onclick=closeCart;
$("#sendWA").onclick=()=>{if(!cart.length)return;
 const L=cart.map(c=>{const p=P.find(x=>x.id===c.id);return `• ${c.q}x ${p.name} (${p.v[c.v].n}) — R$ ${brl(p.price*c.q)},00`});
 const tot=cart.reduce((a,c)=>a+c.q*P.find(p=>p.id===c.id).price,0);
 window.open(wa(`Olá! Gostaria de fazer um pedido na ${STORE}:\n\n${L.join("\n")}\n\n*Total: R$ ${brl(tot)},00*`),"_blank")};
$("#footWA").onclick=()=>window.open(wa(`Olá! Vi o catálogo da ${STORE} e gostaria de mais informações.`),"_blank");
render();
</script>
</body>
</html>
